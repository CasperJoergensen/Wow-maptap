name: Release

# Push a tag like v0.1.0 (or v0.1.0-beta.1 for a beta) to build the zip and
# upload it to CurseForge. Needs the CF_API_KEY repository secret and
# "## X-Curse-Project-ID" in PinpointAzeroth.toc.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Run tests
        run: lua5.1 tests/run.lua && lua5.1 tests/smoke.lua
      - uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
